[project]
name = "openid4vci"
version = "1.0.0a1.dev0"
description = "Library for OpenID for Verifiable Credential Issuance 1.0"
keywords = ["OpenID4VCI", "OpenID", "Verifiable Credentials", "VCI", "DID", "eduTAP"]
readme = "README.md"
authors = [
    {name = "Alexander Loechel", email = "Alexander.Loechel@lmu.de"},
]
requires-python = ">=3.10"
license = { text = "EUPL 1.2" }
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic[email]>=2.0",
    "pydantic_extra_types",
    "pydantic-settings",
    "phonenumbers",
    "pycountry",
    # JOSE is not optional: key possession proofs (Appendix F), signed issuer
    # metadata and encrypted responses (Section 10) are all JWS/JWE/JWK.
    "joserfc",
  ]

[project.urls]
Source = "https://github.com/edutap-eu/OpenID4VCI"
Issues = "https://github.com/edutap-eu/OpenID4VCI/issues"
Documentation = "https://docs.edutap.eu/packages/openid4vci/index.html"

[project.optional-dependencies]
# CBOR and COSE are needed only by the ISO mdoc profile (mso_mdoc). A
# deployment that issues SD-JWT VC or W3C VCDM only should not carry them.
mdoc = [
    "cbor2",
    "pycose",
]
fastapi = [
    "fastapi>=0.95",
    "uvicorn[standard]",
]
test = [
    "openid4vci[fastapi]",
    # starlette's TestClient warns when it finds httpx rather than httpx2,
    # and httpx2 is what our own clients use anyway
    "httpx2",
    "pytest",
    "pytest-asyncio",
    "pytest_httpx",
    "pytest-order",
    "faker",
]
typecheck  = [
    "ty",
]
develop = [
    "pdbp",  # the maintained successor to pdbpp
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openid4vci"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true
from-first = true
lines-after-imports = 2
lines-between-types = 1
no-sections = true
order-by-type = false

[tool.ty.environment]
python-version = "3.10"
extra-paths = ["src", "tests"]

[tool.ty.rules]
unresolved-import = "warn"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as asyncio-based",
]

[tool.codespell]
ignore-words-list = "discreet,"
skip = "*.json,*.csv"

[tool.check-manifest]
ignore = [
    ".editorconfig",
    ".pre-commit-config.yaml",
]

[tool.tox]
min_version = "4.4.0"
env_list = ["py310", "py311", "py312", "py313", "lint"]

[tool.tox.gh.python]
"3.10" = ["py310"]
"3.11" = ["py311"]
"3.12" = ["py312"]
"3.13" = ["py313"]

[tool.tox.env_run_base]
description = "run tests"
use_develop = true
skip_install = false
commands = [["pytest", { replace = "posargs", extend = true }]]
extras = ["test", "develop"]

[tool.tox.env.format]
description = "automatically reformats code"
skip_install = true
deps = ["pre-commit"]
commands = [
    ["pre-commit", "run", "-a", "ruff"],
    ["pre-commit", "run", "-a", "ruff-format"],
]

[tool.tox.env.lint]
description = "run linters that will help improve the code style"
skip_install = true
deps = ["pre-commit"]
commands = [["pre-commit", "run", "-a"]]
